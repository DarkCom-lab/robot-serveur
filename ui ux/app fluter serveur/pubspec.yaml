name: app_serveur_flutter
description: Application mobile Flutter pour les serveurs de café avec robot livreur autonome (Fabtino).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Gestion d'état
  flutter_riverpod: ^2.5.1

  # Navigation & routage
  go_router: ^14.2.0

  # Réseau & Websocket
  http: ^1.2.1
  web_socket_channel: ^2.4.5

  # Stockage sécurisé des jetons
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Formatage & Polices
  intl: ^0.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
